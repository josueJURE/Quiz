<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Anime Quiz Challenge</title>
  </head>
  <body>
    <div class="app-container">
      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
          <h1>Anime Quiz Challenge</h1>
          <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Enter your name" required>
            <select id="languageSelect">
              <option value="">Select Language</option>
              <option value="english">English</option>
              <option value="japanese">日本語</option>
            </select>
          </div>
          <button id="startBtn" class="btn" disabled>Start Quiz</button>
        </div>
      </div>

      <!-- Quiz Screen -->
      <div class="quiz-screen" id="quizScreen" style="display: none;">
        <div class="quiz-header">
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">Question 1 of 5</div>
          </div>
          <div class="timer-container">
            <div class="timer-circle" id="timerCircle">
              <span id="timerValue">10</span>
            </div>
          </div>
        </div>

        <div class="quiz-content">
          <div class="quiz-image-container">
            <img id="quizImage" src="" alt="Anime image">
          </div>
          <div class="options-container" id="optionsContainer"></div>
        </div>
      </div>

      <!-- Results Screen -->
      <div class="results-screen" id="resultsScreen" style="display: none;">
        <div class="results-content">
          <h2 id="resultsTitle">Quiz Completed!</h2>
          <div class="score-display">
            <p id="scoreText">Your score: <span id="scoreValue">0</span>%</p>
            <div class="score-visual">
              <div class="score-circle" id="scoreCircle">
                <span id="scorePercentage">0%</span>
              </div>
            </div>
          </div>
          <div class="character-gif">
            <img id="characterGif" src="" alt="Celebration GIF">
          </div>
          <button id="restartBtn" class="btn">Play Again</button>
        </div>
      </div>
    </div>

    <script type="module" src="index-1.js"></script>
  </body>
</html>
